kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: postgres
  namespace: devboard-ns
  labels:
    app: devboard-postgres

spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-postgres
  serviceName: postgres
  template:
    metadata:
      labels:
        app: devboard-postgres

    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: web
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        env:
          # A freshly-provisioned EBS volume (via the EBS CSI driver) ships
          # with a "lost+found" dir at its root, so initdb refuses to init
          # directly into the mount point. Point PGDATA at a subdirectory
          # instead — same volume, same mountPath, no static PV needed.
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata

          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: devboard-configmap
                key: POSTGRES_USER

          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: devboard-secrets
                key: POSTGRES_PASSWORD

          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: devboard-configmap
                key: POSTGRES_DB
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: pgdata
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-gp3" # dynamically provisioned EBS volume, no static PV needed
      resources:
        requests:
          storage: 0.5Gi
